<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonpetal Glasshouse — a top-down stealth game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #060e0b;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #wrap {
    /* Exact 1280x720 frame; overflow hidden above keeps scrollbars away. */
    width: 1280px;
    max-width: 100vw;
  }
  canvas {
    display: block;
    width: 1280px;
    height: 720px;
    max-width: 100vw;
    max-height: 100vh;
    background: #0e1f1a;
    cursor: crosshair;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720" tabindex="0" aria-label="Moonpetal Glasshouse: a top-down stealth game. Move with WASD or arrow keys, hold Shift to tiptoe, click to toss a pebble."></canvas>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
