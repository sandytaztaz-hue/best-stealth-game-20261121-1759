<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moonpetal Glasshouse — a top-down stealth game</title>
<style>
  html, body { margin: 0; padding: 0; background: #071009; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  canvas { width: min(1280px, 100vw); height: auto; display: block; background: #0e1f1a; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Moonpetal Glasshouse: a top-down stealth game. Move with WASD, tiptoe with Shift, click to toss a pebble."></canvas>
<p id="status" class="visually-hidden" role="status">Moonpetal Glasshouse loading.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
